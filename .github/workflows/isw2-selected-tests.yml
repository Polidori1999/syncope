
name: "ISW2 Selected Tests"

on:
  push:
    branches:
      - master
      - main
      - work-4.1.0
  pull_request:
    branches:
      - master
      - main
      - work-4.1.0
jobs:
  selected-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'

      - name: Show versions
        run: |
          java -version
          mvn -version

    

      - name: Test DefaultJobManager unit, LLM and Randoop tests
        run: >
          mvn -B -e -pl core/provisioning-java -am
          -DskipTests=false
          -Dmaven.build.cache.skipCache=true
          -Dmodernizer.skip=true
          -Dianal.phase=none
          -Drat.skip=true
          -Dcheckstyle.skip=true
          -Dmaven.checkstyle.skip=true
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=DefaultJobManagerBBTest,DefaultJobManagerWBTest,DefaultJobManagerPITTest,DefaultJobManagerLLMGuidedTreeTest,DefaultJobManagerRandoopTest,DefaultJobManagerRandoopTest0
          test

      - name: Test DefaultJobManager integration tests
        run: >
          mvn -B -e -pl core/provisioning-java -am
          test-compile failsafe:integration-test failsafe:verify
          -Dit.test=DefaultJobManagerLoadBBIT,DefaultJobManagerLoadWBIT
          -DskipTests=false
          -DskipITs=false
          -Dmaven.build.cache.skipCache=true
          -Dmodernizer.skip=true
          -Dianal.phase=none
          -Drat.skip=true
          -Dcheckstyle.skip=true
          -Dmaven.checkstyle.skip=true
          -Dfailsafe.failIfNoSpecifiedTests=false
          

      - name: Test AuthDataAccessor
        run: >
          mvn -B -e -pl core/spring -am
          -DskipTests=false
          -Dmaven.build.cache.skipCache=true
          -Dmodernizer.skip=true
          -Dianal.phase=none
          -Drat.skip=true
          -Dcheckstyle.skip=true
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=AuthDataAccessorBBTest,AuthDataAccessorLLMGuidedTreeTest,AuthDataAccessorPitTest,AuthDataAccessorWhiteBoxTest,AuthDataAccessorRandoopTest