name: "ISW2 Selected Tests"

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  selected-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'

      - name: Show versions
        run: |
          java -version
          mvn -version

      - name: Test ContentLoaderHandler
        run: >
          mvn -B -e -pl core/persistence-neo4j -am
          -DskipTests=false
          -Dmaven.build.cache.skipCache=true
          -Dmodernizer.skip=true
          -Dianal.phase=none
          -Drat.skip=true
          -Dcheckstyle.skip=true
          test

      - name: Test DefaultJobManager unit tests
        run: >
          mvn -B -e -pl core/provisioning-java -am
          -DskipTests=false
          -Dmaven.build.cache.skipCache=true
          -Dmodernizer.skip=true
          -Dianal.phase=none
          -Drat.skip=true
          -Dcheckstyle.skip=true
          test

      - name: Test DefaultJobManager integration tests
        run: >
          mvn -B -e -pl core/provisioning-java -am
          -DskipTests=false
          -DskipITs=false
          -Dmaven.build.cache.skipCache=true
          -Dmodernizer.skip=true
          -Dianal.phase=none
          -Drat.skip=true
          -Dcheckstyle.skip=true
          verify
          

      - name: Test AuthDataAccessor unit tests
        run: >
          mvn -B -e -pl core/spring -am
          -DskipTests=false
          -Dmaven.build.cache.skipCache=true
          -Dmodernizer.skip=true
          -Dianal.phase=none
          -Drat.skip=true
          -Dcheckstyle.skip=true
          -Dtest=org.apache.syncope.core.spring.security.AuthDataAccessorTest,org.apache.syncope.core.spring.security.AuthDataAccessorLLMguidedTreTest
          test